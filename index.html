<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Split Bill Modern</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
          <style>
              :root {
                      --primary: #7e22ce;
                            --secondary: #9333ea;
                                  --bg-gradient: linear-gradient(135deg, #f5d0fe, #c084fc);
                                        --text-color: #1e1b4b;
                                              --card-bg: rgba(255, 255, 255, 0.95);
                                                    --error-color: #dc2626;
                                                          --error-bg: #fef2f2;
              }

                  * {
                          box-sizing: border-box;
                                margin: 0;
                                      padding: 0;
                  }

                      body {
                              font-family: 'Inter', sans-serif;
                                    background: var(--bg-gradient);
                                          color: var(--text-color);
                                                display: flex;
                                                      justify-content: center;
                                                            align-items: center;
                                                                  min-height: 100vh;
                                                                        padding: 2rem;
                      }

                          .card {
                                  background: var(--card-bg);
                                        border-radius: 1.5rem;
                                              padding: 2.5rem;
                                                    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
                                                          max-width: 600px;
                                                                width: 100%;
                          }

                              .form-section {
                                      display: flex;
                                            flex-direction: column;
                                                  gap: 1rem;
                              }

                                  h2 {
                                          font-size: 2.2rem;
                                                color: var(--primary);
                                                      font-weight: 700;
                                                            text-align: center;
                                                                  margin-bottom: 0.5rem;
                                  }

                                      label {
                                              font-weight: 600;
                                                    font-size: 0.95rem;
                                                          display: block;
                                                                margin-bottom: 0.3rem;
                                      }

                                          input,
                                              textarea {
                                                      padding: 0.75rem;
                                                            border-radius: 0.75rem;
                                                                  border: 1px solid #d1d5db;
                                                                        font-size: 1rem;
                                                                              background-color: #f9fafb;
                                                                                    width: 100%;
                                                                                          font-family: inherit;
                                              }

                                                  input:focus,
                                                      textarea:focus {
                                                              outline: 2px solid var(--primary);
                                                                    background-color: #fff;
                                                      }

                                                          button {
                                                                  background: linear-gradient(to right, var(--primary), var(--secondary));
                                                                        color: white;
                                                                              padding: 0.85rem;
                                                                                    font-size: 1rem;
                                                                                          border: none;
                                                                                                border-radius: 0.75rem;
                                                                                                      cursor: pointer;
                                                                                                            font-weight: 600;
                                                                                                                  transition: transform 0.2s ease, opacity 0.2s ease;
                                                                                                                        width: 100%;
                                                                                                                              margin-top: 0.5rem;
                                                          }

                                                              button:hover {
                                                                      transform: translateY(-2px);
                                                                            opacity: 0.95;
                                                              }

                                                                  #result {
                                                                          display: none;
                                                                                margin-top: 1.5rem;
                                                                                      background: #f8fafc;
                                                                                            border: 1px solid #e2e8f0;
                                                                                                  border-left: 5px solid var(--primary);
                                                                                                        padding: 1.25rem;
                                                                                                              border-radius: 0.75rem;
                                                                  }

                                                                      #result.active {
                                                                              display: block;
                                                                      }

                                                                          #result.error {
                                                                                  border-left-color: var(--error-color);
                                                                                        background-color: var(--error-bg);
                                                                                              color: var(--error-color);
                                                                                                    font-weight: 600;
                                                                          }

                                                                              .result-section {
                                                                                      margin-bottom: 1rem;
                                                                              }

                                                                                  .result-section:last-child {
                                                                                          margin-bottom: 0;
                                                                                  }

                                                                                      .result-title {
                                                                                              font-weight: 700;
                                                                                                    font-size: 1.05rem;
                                                                                                          margin-bottom: 0.5rem;
                                                                                                                color: var(--primary);
                                                                                                                      border-bottom: 1px solid #e2e8f0;
                                                                                                                            padding-bottom: 0.25rem;
                                                                                      }

                                                                                          .result-row {
                                                                                                  display: flex;
                                                                                                        justify-content: space-between;
                                                                                                              padding: 0.3rem 0;
                                                                                                                    font-size: 0.95rem;
                                                                                          }

                                                                                              .result-row.total {
                                                                                                      font-weight: 700;
                                                                                                            border-top: 1px dashed #cbd5e1;
                                                                                                                  margin-top: 0.5rem;
                                                                                                                        padding-top: 0.5rem;
                                                                                                                              font-size: 1.05rem;
                                                                                              }
                                                                                                </style>
                                                                                                </head>

                                                                                                <body>
                                                                                                  <div class="card">
                                                                                                      <div class="form-section">
                                                                                                            <h2>💸 Split Bill per Orang</h2>

                                                                                                                  <div>
                                                                                                                          <label for="menuPerOrang">Harga Menu per Orang (Nama=harga, satu per baris):</label>
                                                                                                                                  <textarea id="menuPerOrang" rows="5" placeholder="Contoh:&#10;Yunus=50000&#10;Sciros=60000"></textarea>
                                                                                                                                        </div>

                                                                                                                                              <div>
                                                                                                                                                      <label for="diskon">Diskon Persentase (%)</label>
                                                                                                                                                              <input type="number" id="diskon" min="0" max="100" placeholder="Contoh: 10 (Opsional)">
                                                                                                                                                                    </div>

                                                                                                                                                                          <div>
                                                                                                                                                                                  <label for="maxDiskonNominal">Maksimal Diskon Persentase (Rp)</label>
                                                                                                                                                                                          <input type="number" id="maxDiskonNominal" min="0" placeholder="Contoh: 50000 (Opsional)">
                                                                                                                                                                                                </div>

                                                                                                                                                                                                      <div>
                                                                                                                                                                                                              <label for="diskonTambahanNominal">Diskon Tambahan (Rp)</label>
                                                                                                                                                                                                                      <input type="number" id="diskonTambahanNominal" min="0" placeholder="Contoh: 15000 (Opsional)">
                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                          <label for="biayaTambahan">Biaya Tambahan (Ongkir, Pajak, dll.) (Rp)</label>
                                                                                                                                                                                                                                                  <input type="number" id="biayaTambahan" min="0" placeholder="Contoh: 20000 (Opsional)">
                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                              <button id="btnHitung">Hitung Split Bill</button>

                                                                                                                                                                                                                                                                    <div id="result"></div>
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                function formatRupiah(angka) {
                                                                                                                                                                                                                                                                                          return Math.round(angka).toLocaleString('id-ID');
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                    document.getElementById('btnHitung').addEventListener('click', function () {
                                                                                                                                                                                                                                                                                              const resultDiv = document.getElementById('result');
                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                          const menuText = document.getElementById('menuPerOrang').value.trim();
                                                                                                                                                                                                                                                                                                                const diskonPersenInput = parseFloat(document.getElementById('diskon').value);
                                                                                                                                                                                                                                                                                                                      const maxDiskonNominalInput = parseFloat(document.getElementById('maxDiskonNominal').value);
                                                                                                                                                                                                                                                                                                                            const diskonTambahanNominalInput = parseFloat(document.getElementById('diskonTambahanNominal').value);
                                                                                                                                                                                                                                                                                                                                  const biayaTambahanInput = parseFloat(document.getElementById('biayaTambahan').value);
                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                        const diskonPersen = isNaN(diskonPersenInput) || diskonPersenInput < 0 ? 0 : diskonPersenInput;
                                                                                                                                                                                                                                                                                                                                              const maxDiskonNominal = isNaN(maxDiskonNominalInput) || maxDiskonNominalInput < 0 ? Infinity : maxDiskonNominalInput;
                                                                                                                                                                                                                                                                                                                                                    const diskonTambahan = isNaN(diskonTambahanNominalInput) || diskonTambahanNominalInput < 0 ? 0 : diskonTambahanNominalInput;
                                                                                                                                                                                                                                                                                                                                                          const biayaTambahan = isNaN(biayaTambahanInput) || biayaTambahanInput < 0 ? 0 : biayaTambahanInput;
                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                if (!menuText) {
                                                                                                                                                                                                                                                                                                                                                                            showError("❗ Harap isi daftar harga menu per orang.");
                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                // Filter baris kosong agar spasi/enter ekstra di akhir tidak menyebabkan error
                                                                                                                                                                                                                                                                                                                                                                                                      const baris = menuText.split('\n').map(b => b.trim()).filter(b => b !== '');
                                                                                                                                                                                                                                                                                                                                                                                                            let totalSebelumDiskon = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                  const orang = [];
                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                        for (const b of baris) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    const parts = b.split('=');
                                                                                                                                                                                                                                                                                                                                                                                                                                            if (parts.length < 2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                          showError(`❗ Format salah pada baris: "${b}". Gunakan format Nama=harga`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const nama = parts[0].trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const hargaStr = parts.slice(1).join('=').trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const harga = parseFloat(hargaStr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!nama || isNaN(harga)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          showError(`❗ Format salah pada baris: "${b}". Harga harus berupa angka.`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (harga < 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showError(`❗ Harga tidak boleh negatif pada baris: "${b}"`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            orang.push({ nama, harga });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    totalSebelumDiskon += harga;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // --- Perhitungan ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const diskonBerdasarkanPersen = totalSebelumDiskon * (diskonPersen / 100);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const diskonPersenYangDiaplikasikan = Math.min(diskonBerdasarkanPersen, maxDiskonNominal);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const totalSetelahDiskonPersen = totalSebelumDiskon - diskonPersenYangDiaplikasikan;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const totalSetelahSemuaDiskon = Math.max(0, totalSetelahDiskonPersen - diskonTambahan);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const totalFinal = totalSetelahSemuaDiskon + biayaTambahan;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // --- Output Render HTML ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          resultDiv.className = 'active';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="result-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="result-title">📋 Ringkasan Bill</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="result-row"><span>Total Harga Menu:</span> <span>Rp ${formatRupiah(totalSebelumDiskon)}</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (diskonPersen > 0 || maxDiskonNominal !== Infinity) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const infoMax = maxDiskonNominal !== Infinity ? `, maks Rp ${formatRupiah(maxDiskonNominal)}` : '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                html += `<div class="result-row"><span>Diskon (${diskonPersen}%${infoMax}):</span> <span>- Rp ${formatRupiah(diskonPersenYangDiaplikasikan)}</span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (diskonTambahan > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        html += `<div class="result-row"><span>Diskon Tambahan:</span> <span>- Rp ${formatRupiah(diskonTambahan)}</span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (biayaTambahan > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                html += `<div class="result-row"><span>Biaya Tambahan:</span> <span>+ Rp ${formatRupiah(biayaTambahan)}</span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="result-row total"><span>Total Akhir Pembayaran:</span> <span>Rp ${formatRupiah(totalFinal)}</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="result-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="result-title">💰 Tagihan per Orang</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (totalSebelumDiskon <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const biayaPerOrang = orang.length > 0 ? totalFinal / orang.length : 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            orang.forEach(o => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          html += `<div class="result-row"><span>${o.nama}</span> <span>Rp ${formatRupiah(biayaPerOrang)}</span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    orang.forEach(o => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const porsi = o.harga / totalSebelumDiskon;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const bayar = totalFinal * porsi;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      html += `<div class="result-row"><span>${o.nama} (Awal: Rp ${formatRupiah(o.harga)})</span> <span><strong>Rp ${formatRupiah(bayar)}</strong></span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          html += `</div>`;
